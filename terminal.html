<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101525">
<title>MoskVol — Arch Linux Terminal</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap');
:root{color-scheme:dark;--bg:#101525;--card:#192138;--bar:#26304b;--text:#edf5ff;--muted:#a7b9d0;--blue:#80d0ff;--green:#a5efc4;--border:#3b4b69}
:root.light{color-scheme:light;--bg:#edf5fc;--card:#fff;--bar:#dce8f6;--text:#1b2d42;--muted:#4a617b;--blue:#116ea5;--green:#1e7850;--border:#adbed2}
*{box-sizing:border-box}body{min-height:100vh;margin:0;color:var(--text);background:radial-gradient(circle at 10% 10%,#477eb54a,transparent 35%),radial-gradient(circle at 95% 95%,#744bb133,transparent 38%),var(--bg);font:500 15px/1.6 Manrope,system-ui,sans-serif}a{color:inherit;text-decoration:none}button,input{font:inherit}button{cursor:pointer}a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
.wrap{max-width:1200px;margin:auto;padding:20px clamp(15px,4vw,45px) 40px}.back{display:inline-block;padding:10px 17px;border:1px solid var(--border);border-radius:999px;background:var(--card);font-weight:800}.back:hover,.quick button:hover,.tools button:hover{border-color:var(--blue)}.eyebrow{margin-top:42px;color:var(--blue);font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}h1{font-size:clamp(36px,6vw,66px);letter-spacing:-.07em;line-height:1.07;margin:7px 0}h1 span{color:var(--blue)}.lead{color:var(--muted);margin:0 0 26px}
.terminal{background:var(--card);border:1px solid var(--border);border-radius:24px;overflow:hidden;box-shadow:0 30px 70px #0005}.bar{min-height:54px;display:flex;align-items:center;gap:12px;padding:9px 16px;background:var(--bar);border-bottom:1px solid var(--border)}.dots{display:flex;gap:6px}.dots i{width:11px;height:11px;border-radius:50%;background:#ff778b}.dots i:nth-child(2){background:#ffd27a}.dots i:nth-child(3){background:#80dfab}.title{flex:1;text-align:center;color:var(--muted);font:500 12px 'JetBrains Mono',monospace}.tools{display:flex;gap:6px}.tools button{border:1px solid var(--border);border-radius:9px;background:var(--card);color:var(--text);padding:6px 9px;font-size:12px}
.screen{height:min(61vh,610px);min-height:390px;overflow:auto;padding:22px;font:14px/1.6 'JetBrains Mono',monospace;white-space:pre-wrap;overflow-wrap:anywhere;scrollbar-color:var(--border) transparent}.line{margin-bottom:7px}.blue{color:var(--blue)}.green{color:var(--green)}.muted{color:var(--muted)}.error{color:#ff9dac}.entry{display:flex;gap:6px;align-items:baseline}.entry label{white-space:nowrap}.entry input{flex:1;min-width:0;padding:0;color:var(--text);background:transparent;border:0;outline:0;font:inherit;caret-color:var(--blue)}.entry input:focus-visible{outline:0}.quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.quick button{background:var(--card);border:1px solid var(--border);border-radius:999px;color:var(--text);padding:8px 13px;font:500 12px 'JetBrains Mono',monospace}.tip{color:var(--muted);font-size:12px}
@media(max-width:650px){.screen{height:60svh;padding:15px;font-size:12px}.title{font-size:10px}.tools button{font-size:11px;padding:5px}.wrap{padding-top:13px}.eyebrow{margin-top:28px}}@media(max-width:350px){.title{display:none}.bar{justify-content:space-between}}
</style>
</head>
<body><div class="wrap">
<a href="index.html" class="back">← На главную</a>
<div class="eyebrow">Интерактивная мастерская MoskVol</div><h1>Терминал <span>Arch Linux.</span></h1>
<p class="lead">Исследуй папки, пробуй команды и находи пасхалки. Это симуляция: она ничего не запускает на твоём устройстве.</p>
<main class="terminal" aria-label="Виртуальный терминал"><div class="bar"><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span><span class="title">moskvol@archlinux: ~</span><span class="tools"><button id="theme" type="button">◐ Тема</button><button id="clear" type="button">⌫ Очистить</button></span></div>
<div class="screen" id="screen" role="log" aria-live="polite"><div id="output"></div><div class="entry"><label for="cmd"><span class="green">moskvol@arch</span>:<span id="path" class="blue">~</span>$</label><input id="cmd" aria-label="Введите команду" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="send"></div></div></main>
<div class="quick" aria-label="Быстрые команды"><button data-cmd="help">help</button><button data-cmd="fastfetch">fastfetch</button><button data-cmd="ls">ls</button><button data-cmd="tree">tree</button><button data-cmd="pacman -Syu">pacman -Syu</button><button data-cmd="fortune">fortune</button><button data-cmd="matrix">matrix</button></div>
<p class="tip">↑ / ↓ — история команд · Tab — автодополнение · Начни с help</p>
</div>
<script>
'use strict';
const screen=document.getElementById('screen'),out=document.getElementById('output'),input=document.getElementById('cmd'),path=document.getElementById('path');
const fs={
'/' : ['home','etc'], '/home':['moskvol'], '/home/moskvol':['about.txt','friends.txt','projects.txt','notes','welcome.md'],
'/home/moskvol/notes':['ideas.txt','arch.txt'], '/etc':['os-release','hostname'],
'/home/moskvol/about.txt':'Привет! Я MoskVol. Люблю нейросети и создавать цифровые проекты.',
'/home/moskvol/friends.txt':'Gemini ✧ — идеи и эксперименты\nChatGPT ✳ — диалог и код\nClaude ✦ — тексты и анализ',
'/home/moskvol/projects.txt':'Quiz Battle — викторина для друзей.\nSteamForge — эксперимент с игровыми инструментами.\nПортфолио — сайт, на котором ты сейчас находишься.',
'/home/moskvol/welcome.md':'Добро пожаловать! Попробуй help, fastfetch, ls, tree, cat friends.txt.',
'/home/moskvol/notes/ideas.txt':'Большие проекты начинаются с маленького эксперимента.',
'/home/moskvol/notes/arch.txt':'Arch Linux — дистрибутив Linux, известный гибкой настройкой.',
'/etc/os-release':'NAME="Arch Linux"\nPRETTY_NAME="Arch Linux (виртуальный терминал MoskVol)"',
'/etc/hostname':'archlinux'};
const commands=['help','man','about','friends','projects','fastfetch','neofetch','whoami','hostname','pwd','ls','cd','cat','tree','echo','date','uname','pacman','yay','systemctl','ip','ping','history','clear','theme','fortune','cowsay','matrix','sudo','exit'];
let cwd='/home/moskvol',hist=[],hi=0,fi=0;
const fortunes=['Любопытство — начало любого проекта.','Сегодня отличный день, чтобы узнать что-то новое.','Большие идеи начинаются с маленького шага.','Ошибка — подсказка, а не конец пути.'];
function print(s='',kind=''){const el=document.createElement('div');el.className='line '+kind;el.textContent=s;out.append(el);screen.scrollTop=screen.scrollHeight}
function loc(p){const a=[];for(const part of (p[0]==='/'?p:cwd+'/'+p).split('/')){if(!part||part==='.')continue;if(part==='..')a.pop();else a.push(part)}return '/'+a.join('/')}
function label(){return cwd.replace(/^\/home\/moskvol(?=\/|$)/,'~')||'/'}
function listing(p){const x=fs[p];if(x===undefined)print('ls: файл или каталог не найден','error');else if(Array.isArray(x))print(x.map(n=>Array.isArray(fs[loc(p+'/'+n)])?n+'/':n).join('    '),'blue');else print(p.split('/').pop())}
function tree(p,depth=0){const x=fs[p];if(x===undefined){print('tree: каталог не найден','error');return}print('  '.repeat(depth)+(depth?'└─ ':'')+(depth?p.split('/').pop():label())+(Array.isArray(x)?'/':''),Array.isArray(x)?'blue':'');if(Array.isArray(x)&&depth<5)x.forEach(n=>tree(loc(p+'/'+n),depth+1))}
function fetch(){print('          /\\          moskvol@archlinux\n         /  \\         ─────────────────────\n        / /\\ \\        OS: Arch Linux (симуляция)\n       / ____ \\       Shell: MoskVol Web Terminal\n      /_/    \\_\\      Theme: Arch blue\n                       Interests: AI, идеи, проекты\n                       Friends: Gemini, ChatGPT, Claude','blue')}
function help(){print('КОМАНДЫ · попробуй разные варианты','blue');print('help / man            справка\nabout / friends       обо мне и нейросетях\nprojects              мои проекты\nfastfetch / neofetch  информация о системе\nls / cd / pwd / tree  виртуальные папки\ncat <файл>            чтение файла\necho <текст>          вывести текст\nwhoami / hostname / uname / date\npacman -Syu / -Q / -Ss <пакет>\nyay -S <пакет> / systemctl status / ip a / ping\nhistory / clear / theme\nfortune / cowsay <текст> / matrix');print('Подсказка: cat about.txt · cd notes · cat ideas.txt','muted')}
function theme(){document.documentElement.classList.toggle('light');try{localStorage.setItem('moskvol-term-theme',document.documentElement.classList.contains('light')?'light':'dark')}catch{}}
function run(raw){const args=raw.trim().match(/(?:"[^"]*"|'[^']*'|\S)+/g)?.map(x=>x.replace(/^["']|["']$/g,''))||[];const cmd=(args.shift()||'').toLowerCase(),a=args.join(' ');
switch(cmd){
case 'help':case 'man':help();break;case 'about':print(fs['/home/moskvol/about.txt']);break;case 'friends':print(fs['/home/moskvol/friends.txt'],'blue');break;case 'projects':print(fs['/home/moskvol/projects.txt']);break;
case 'whoami':print('moskvol');break;case 'hostname':print('archlinux');break;case 'pwd':print(cwd);break;
case 'ls':listing(loc(args[0]||'.'));break;case 'tree':tree(loc(args[0]||'.'));break;
case 'cd':{const d=loc(args[0]||'/home/moskvol');if(Array.isArray(fs[d])){cwd=d;path.textContent=label()}else print('cd: каталог не найден: '+(args[0]||''),'error');break}
case 'cat':if(!args.length)print('Использование: cat <файл>','muted');else args.forEach(n=>{const f=fs[loc(n)];print(typeof f==='string'?f:'cat: не удалось открыть '+n,typeof f==='string'?'':'error')});break;
case 'echo':print(a);break;case 'date':print(new Intl.DateTimeFormat('ru-RU',{dateStyle:'full',timeStyle:'medium'}).format(new Date()));break;
case 'uname':print(args[0]==='-a'?'Linux archlinux 6.12.0-moskvol x86_64 GNU/Linux (симуляция)':'Linux');break;
case 'fastfetch':case 'neofetch':fetch();break;
case 'pacman':if(args[0]==='-Syu'){print(':: Синхронизация баз пакетов...','blue');print('core, extra, multilib — обновлены. Система актуальна. (Симуляция.)','green')}else if(args[0]==='-Q')print('linux 6.12.0\nfirefox 134.0\npython 3.13.0\nfastfetch 2.32.0\nvim 9.1');else if(args[0]==='-Ss')print('Найдено: '+(args[1]||'пакет')+' · учебный каталог','blue');else print('Использование: pacman -Syu | -Q | -Ss <пакет>','muted');break;
case 'yay':print(args[0]==='-S'&&args[1]?'Установка '+args[1]+' показана только в симуляции.':'Использование: yay -S <пакет>','muted');break;
case 'systemctl':print(args[0]==='status'?'● archlinux.service — active (running) · виртуальная среда':'Использование: systemctl status','muted');break;
case 'ip':print(args[0]==='a'?'1: lo: <LOOPBACK,UP>\n    inet 127.0.0.1/8 (демонстрация)':'Использование: ip a','muted');break;
case 'ping':print(args[0]?'PING '+args[0]+': ответ виртуального терминала за 12 ms (сеть не используется)':'Использование: ping <адрес>','muted');break;
case 'history':hist.forEach((h,i)=>print(String(i+1).padStart(3)+'  '+h));break;case 'clear':out.replaceChildren();break;case 'theme':theme();print('Тема изменена.','green');break;
case 'fortune':print(fortunes[fi++%fortunes.length],'green');break;
case 'cowsay':print('< '+(a||'Привет от MoskVol!')+' >\n     \\   ^__^\n      \\  (oo)\\_______\n         (__)\\       )\\/\\\n             ||----w |\n             ||     ||');break;
case 'matrix':print('101001 ▒ 011101 ▒ 110010\n010110 ▒ 100101 ▒ 001011\n110100 ▒ 011010 ▒ 101101','green');print('Ты нашёл пасхалку!');break;
case 'sudo':print('Права администратора здесь не нужны: это безопасная симуляция.','muted');break;
case 'exit':print('До встречи! Введи help, чтобы продолжить.','green');break;
default:print('arch: команда не найдена: '+cmd+' · попробуй help','error')}}
function submit(v){v=v.trim();if(!v)return;print('moskvol@arch:'+label()+'$ '+v);hist.push(v);hi=hist.length;run(v);input.value='';screen.scrollTop=screen.scrollHeight}
try{if(localStorage.getItem('moskvol-term-theme')==='light')document.documentElement.classList.add('light')}catch{}
input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();submit(input.value)}else if(e.key==='ArrowUp'){e.preventDefault();if(hi>0)input.value=hist[--hi]}else if(e.key==='ArrowDown'){e.preventDefault();input.value=hi<hist.length-1?hist[++hi]:(hi=hist.length,'')}else if(e.key==='Tab'){e.preventDefault();const v=input.value.trim();if(!v.includes(' ')){const matches=commands.filter(c=>c.startsWith(v));if(matches.length===1)input.value=matches[0]+' ';else if(matches.length>1)print(matches.join('   '),'muted')}}});
document.getElementById('clear').onclick=()=>{out.replaceChildren();input.focus()};document.getElementById('theme').onclick=()=>{theme();input.focus()};document.querySelectorAll('[data-cmd]').forEach(b=>b.onclick=()=>{submit(b.dataset.cmd);input.focus()});screen.addEventListener('click',()=>input.focus());
print('▲ ARCH LINUX × MOSKVOL TERMINAL','blue');print('Добро пожаловать в мой виртуальный терминал!','green');print('Введи help, чтобы увидеть команды. ↑ / ↓ — история, Tab — дополнение.','muted');
</script></body></html>
